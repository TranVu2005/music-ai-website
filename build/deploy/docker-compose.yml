version: '3.8'

services:
  # Primary PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: music_shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-music_shop_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Unified Next.js application service
  app:
    build:
      context: ../..
      dockerfile: build/deploy/Dockerfile
    container_name: music_shop_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-music_shop_db}?schema=public
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - postgres

volumes:
  postgres_data:
