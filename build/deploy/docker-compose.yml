version: '3.8'

services:
  # Cơ sở dữ liệu chính
  postgres:
    image: postgres:16-alpine
    container_name: music_shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: music_shop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service
  backend:
    build:
      context: ../..
      dockerfile: build/deploy/Dockerfile
    container_name: music_shop_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/music_shop_db?schema=public
    depends_on:
      - postgres

  # Frontend Service
  frontend:
    build:
      context: ../..
      dockerfile: build/deploy/Dockerfile
    container_name: music_shop_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
